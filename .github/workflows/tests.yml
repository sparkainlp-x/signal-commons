name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile signal_commons.py test_signal_commons.py
      - run: python -m unittest -v test_signal_commons.py
      - run: python signal_commons.py --demo > demo.json && python -c "import json; json.load(open('demo.json'))"
